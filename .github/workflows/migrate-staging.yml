name: Migrate — Staging

on:
  push:
    branches: [main]
    paths:
      - '**/*.sql'
      - '.github/workflows/migrate-staging.yml'

concurrency:
  group: migrate-staging
  cancel-in-progress: false

jobs:
  migrate-staging:
    name: Apply Migrations to Neon Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://console.neon.tech
    steps:
      - uses: actions/checkout@v6

      - name: Install psql
        run: sudo apt-get install -y postgresql-client

      - name: Run shared schema migration
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f shared/postgres/migrations/001_create_schema.sql

      - name: Run screenerx schema migration
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f screenerx/postgres/migrations/001_create_schema.sql

      - name: Run quantnova schema migration
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f quantnova/postgres/migrations/001_create_schema.sql

      - name: Run ndfl schema migration
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f ndfl/postgres/migrations/001_create_schema.sql

      - name: Run v1.1.0 DDL migrations
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -f screenerx/postgres/ddl/080_market_indices.sql
          psql "$DATABASE_URL" -f screenerx/postgres/ddl/081_fii_dii_activity.sql
          psql "$DATABASE_URL" -f screenerx/postgres/ddl/082_ipos.sql

      - name: Load seed data
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -f shared/postgres/dml/seed_001_users.sql
          psql "$DATABASE_URL" -f screenerx/postgres/dml/seed_002_exchanges.sql
          psql "$DATABASE_URL" -f screenerx/postgres/dml/seed_003_symbols.sql
          psql "$DATABASE_URL" -f screenerx/postgres/dml/seed_004_companies.sql
          psql "$DATABASE_URL" -f screenerx/postgres/dml/seed_005_market_data.sql
          psql "$DATABASE_URL" -f screenerx/postgres/dml/seed_006_portfolios.sql
          psql "$DATABASE_URL" -f screenerx/postgres/dml/seed_007_screeners.sql
          psql "$DATABASE_URL" -f quantnova/postgres/dml/seed_008_trading.sql
          psql "$DATABASE_URL" -f screenerx/postgres/dml/seed_010_market_indices.sql
          psql "$DATABASE_URL" -f screenerx/postgres/dml/seed_011_fii_dii.sql
          psql "$DATABASE_URL" -f screenerx/postgres/dml/seed_012_ipos.sql
          psql "$DATABASE_URL" -f screenerx/postgres/dml/seed_013_economic_events.sql

      - name: Verify row counts
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -c "
            SELECT table_schema, count(*) AS tables
            FROM information_schema.tables
            WHERE table_schema IN ('shared','screenerx','quantnova','ndfl')
            GROUP BY 1 ORDER BY 1;"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Staging migration failed — ${context.sha.slice(0,7)}`,
              body: `Staging database migration failed.\n\nCommit: ${context.sha}\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'database', 'staging']
            })
