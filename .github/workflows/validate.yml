name: Validate SQL Migrations

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql-syntax:
    name: SQL Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pgFormatter / sqlfluff
        run: pip install sqlfluff

      - name: Lint SQL files
        run: |
          find . -name "*.sql" -not -path "./.git/*" | while read f; do
            sqlfluff lint "$f" --dialect postgres --rules L001,L002,L003,L010,L011,L014 || true
          done

  migration-order:
    name: Migration Order & Naming Convention
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check DDL file naming (NNN_*.sql)
        run: |
          FAIL=0
          find . -path "*/postgres/ddl/*.sql" | while read f; do
            base=$(basename "$f")
            if ! [[ "$base" =~ ^[0-9]{3}_.+\.sql$ ]]; then
              echo "ERR: DDL file does not follow NNN_name.sql convention: $f"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Check seed file naming (seed_NNN_*.sql)
        run: |
          FAIL=0
          find . -path "*/postgres/dml/seed_*.sql" | while read f; do
            base=$(basename "$f")
            if ! [[ "$base" =~ ^seed_[0-9]{3}_.+\.sql$ ]]; then
              echo "ERR: Seed file does not follow seed_NNN_name.sql convention: $f"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Check for destructive statements in migrations
        run: |
          FAIL=0
          for f in $(find . -path "*/postgres/ddl/*.sql" -o -path "*/postgres/migrations/*.sql"); do
            if grep -qiE '^\s*(DROP\s+(TABLE|COLUMN|SCHEMA|TYPE)|ALTER\s+TABLE.+DROP|TRUNCATE)' "$f"; then
              echo "WARN: Potentially destructive statement found in $f"
            fi
          done

  dry-run-neon:
    name: Migration Dry Run (Neon Branch)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get install -y postgresql-client

      - name: Create Neon branch for this PR
        id: neon-branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 << 'EOF'
          import json, os, sys, urllib.request, urllib.error

          api_key    = os.environ['NEON_API_KEY']
          project_id = os.environ['NEON_PROJECT_ID']
          db_pass    = os.environ['STAGING_DB_PASSWORD']
          pr_number  = os.environ['PR_NUMBER']
          branch_name = f"pr-{pr_number}-validate"
          github_output = os.environ['GITHUB_OUTPUT']

          headers = {
              'Authorization': f'Bearer {api_key}',
              'Content-Type': 'application/json',
          }

          def neon_request(method, path, body=None):
              url = f'https://console.neon.tech/api/v2/projects/{project_id}{path}'
              data = json.dumps(body).encode() if body else None
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read())

          # Get parent branch id (prefer 'main', fall back to first branch)
          branches = neon_request('GET', '/branches')['branches']
          parent = next((b for b in branches if b['name'] == 'main'), branches[0])
          print(f"Parent branch: {parent['name']} ({parent['id']})")

          # Create ephemeral branch
          result = neon_request('POST', '/branches', {
              'branch': {'name': branch_name, 'parent_id': parent['id']},
              'endpoints': [{'type': 'read_write'}]
          })

          branch_id = result['branch']['id']
          host      = result['endpoints'][0]['host']
          print(f"Created branch: {branch_id}  host: {host}")

          db_url = f"postgresql://neondb_owner:{db_pass}@{host}/neondb?sslmode=require"

          with open(github_output, 'a') as f:
              f.write(f"db_url={db_url}\n")
              f.write(f"branch_id={branch_id}\n")
          EOF

      - name: Run all migrations on branch
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
        run: |
          DB="$DATABASE_URL"
          psql "$DB" -v ON_ERROR_STOP=1 -f shared/postgres/migrations/001_create_schema.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f screenerx/postgres/migrations/001_create_schema.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f quantnova/postgres/migrations/001_create_schema.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f ndfl/postgres/migrations/001_create_schema.sql
          psql "$DB" -f screenerx/postgres/ddl/080_market_indices.sql
          psql "$DB" -f screenerx/postgres/ddl/081_fii_dii_activity.sql
          psql "$DB" -f screenerx/postgres/ddl/082_ipos.sql

      - name: Verify table counts
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
        run: |
          psql "$DATABASE_URL" -c "
            SELECT table_schema, count(*) AS tables
            FROM information_schema.tables
            WHERE table_schema IN ('shared','screenerx','quantnova','ndfl')
            GROUP BY 1 ORDER BY 1;"

      - name: Delete Neon branch
        if: always()
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          curl -s -X DELETE \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${{ steps.neon-branch.outputs.branch_id }}" \
            -H "Authorization: Bearer ${NEON_API_KEY}"

  schema-diff:
    name: Post Schema Diff as PR Comment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute changed SQL files
        id: diff
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.sql' | head -40)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Post diff comment
        uses: actions/github-script@v7
        with:
          script: |
            const files = `${{ steps.diff.outputs.files }}`.trim()
            if (!files) return
            const body = `### SQL files changed in this PR\n\`\`\`\n${files}\n\`\`\``
            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo
            })
            const existing = comments.data.find(c => c.body.startsWith('### SQL files changed'))
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              })
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              })
            }
