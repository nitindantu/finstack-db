name: Validate SQL Migrations

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql-syntax:
    name: SQL Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pgFormatter / sqlfluff
        run: pip install sqlfluff

      - name: Lint SQL files
        run: |
          find . -name "*.sql" -not -path "./.git/*" | while read f; do
            sqlfluff lint "$f" --dialect postgres --rules L001,L002,L003,L010,L011,L014 || true
          done

  migration-order:
    name: Migration Order & Naming Convention
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check DDL file naming (NNN_*.sql)
        run: |
          FAIL=0
          find . -path "*/postgres/ddl/*.sql" | while read f; do
            base=$(basename "$f")
            if ! [[ "$base" =~ ^[0-9]{3}_.+\.sql$ ]]; then
              echo "ERR: DDL file does not follow NNN_name.sql convention: $f"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Check seed file naming (seed_NNN_*.sql)
        run: |
          FAIL=0
          find . -path "*/postgres/dml/seed_*.sql" | while read f; do
            base=$(basename "$f")
            if ! [[ "$base" =~ ^seed_[0-9]{3}_.+\.sql$ ]]; then
              echo "ERR: Seed file does not follow seed_NNN_name.sql convention: $f"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Check for destructive statements in migrations
        run: |
          FAIL=0
          for f in $(find . -path "*/postgres/ddl/*.sql" -o -path "*/postgres/migrations/*.sql"); do
            if grep -qiE '^\s*(DROP\s+(TABLE|COLUMN|SCHEMA|TYPE)|ALTER\s+TABLE.+DROP|TRUNCATE)' "$f"; then
              echo "WARN: Potentially destructive statement found in $f"
            fi
          done

  dry-run-neon:
    name: Migration Dry Run (Neon Branch)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get install -y postgresql-client

      - name: Create Neon branch for this PR
        id: neon-branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          BRANCH_NAME="pr-${{ github.event.pull_request.number }}-validate"
          RESPONSE=$(curl -s -X POST \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"branch\": {\"name\": \"${BRANCH_NAME}\", \"parent_id\": \"$(curl -s 'https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches' -H 'Authorization: Bearer ${NEON_API_KEY}' | python3 -c 'import sys,json; branches=json.load(sys.stdin)[\"branches\"]; print(next(b[\"id\"] for b in branches if b[\"name\"]==\"main\"))')\"}, \"endpoints\": [{\"type\": \"read_write\"}]}")
          ENDPOINT_HOST=$(echo "$RESPONSE" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d["endpoints"][0]["host"])')
          echo "db_url=postgresql://neondb_owner:${{ secrets.STAGING_DB_PASSWORD }}@${ENDPOINT_HOST}/neondb?sslmode=require" >> "$GITHUB_OUTPUT"
          echo "branch_id=$(echo $RESPONSE | python3 -c 'import sys,json; print(json.load(sys.stdin)[\"branch\"][\"id\"])')" >> "$GITHUB_OUTPUT"

      - name: Run all migrations on branch
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
        run: |
          DB="$DATABASE_URL"
          psql "$DB" -v ON_ERROR_STOP=1 -f shared/postgres/migrations/001_create_schema.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f screenerx/postgres/migrations/001_create_schema.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f quantnova/postgres/migrations/001_create_schema.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f ndfl/postgres/migrations/001_create_schema.sql
          psql "$DB" -f screenerx/postgres/ddl/080_market_indices.sql
          psql "$DB" -f screenerx/postgres/ddl/081_fii_dii_activity.sql
          psql "$DB" -f screenerx/postgres/ddl/082_ipos.sql

      - name: Verify table counts
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
        run: |
          psql "$DATABASE_URL" -c "
            SELECT table_schema, count(*) AS tables
            FROM information_schema.tables
            WHERE table_schema IN ('shared','screenerx','quantnova','ndfl')
            GROUP BY 1 ORDER BY 1;"

      - name: Delete Neon branch
        if: always()
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          curl -s -X DELETE \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${{ steps.neon-branch.outputs.branch_id }}" \
            -H "Authorization: Bearer ${NEON_API_KEY}"

  schema-diff:
    name: Post Schema Diff as PR Comment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute changed SQL files
        id: diff
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.sql' | head -40)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Post diff comment
        uses: actions/github-script@v7
        with:
          script: |
            const files = `${{ steps.diff.outputs.files }}`.trim()
            if (!files) return
            const body = `### SQL files changed in this PR\n\`\`\`\n${files}\n\`\`\``
            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo
            })
            const existing = comments.data.find(c => c.body.startsWith('### SQL files changed'))
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              })
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              })
            }
